name: Final Project CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Lint
        run: make lint
      - name: Format check
        run: make format-check
      - name: Tests
        run: make test
      - name: Isolated smoke experiment
        run: |
          rm -rf results/ci_smoke
          make smoke
          test -f results/ci_smoke/raw/v2_fixed_cora_smoke.csv
          test -f results/ci_smoke/aggregated/v2_aggregated_summary.csv
      - name: Static website validation
        run: |
          test -f docs/index.html
          test -f docs/assets/app.js
          test -f docs/assets/styles.css
          node --check docs/assets/app.js
