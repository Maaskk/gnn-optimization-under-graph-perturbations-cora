experiment_id: final_inference_robustness
version: final
datasets: [Cora]
protocol: fixed
robustness_setting: inference_time
seeds: [42, 43, 44, 45, 46]
optimizers: [Adam, AdamW, RMSProp, AdaGrad, SGD]
perturbations: [feature_masking, edge_removal, fake_edge_addition]
severities: [0.20]
training:
  epochs: 200
  hidden_channels: 16
  dropout: 0.5
  learning_rate: 0.01
  weight_decay: 0.0005
  device: cpu
tuning:
  enabled: false
notes: >
  Clean-trained models are evaluated under 20 percent perturbed inputs with fixed weights.
