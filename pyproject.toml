[project]
name = "gnn-optimization-under-graph-perturbations-cora"
version = "2.0.0"
description = "Reproducible GCN optimizer robustness experiments under random graph perturbations."
requires-python = ">=3.11,<3.13"
readme = "README.md"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.coverage.run]
source = ["src/gnn_robustness"]

[tool.coverage.report]
show_missing = true
skip_covered = true
