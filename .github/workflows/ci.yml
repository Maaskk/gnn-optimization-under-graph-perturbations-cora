name: Final Project CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Create virtual environment and install dependencies
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt

      - name: Lint
        run: make lint

      - name: Format check
        run: make format-check

      - name: Tests
        run: make test

      - name: Isolated smoke experiment
        run: |
          rm -rf results/ci_smoke
          make smoke
          test -d results/ci_smoke/raw
          test -d results/ci_smoke/aggregated
          test -n "$(find results/ci_smoke/raw -type f -name '*.csv' -print -quit)"
          test -n "$(find results/ci_smoke/aggregated -type f -name '*.csv' -print -quit)"

      - name: Validate static website files
        run: |
          test -f docs/index.html
          test -f docs/assets/app.js
          test -f docs/assets/styles.css
          test -d docs/assets/data
          test -n "$(find docs/assets/data -maxdepth 1 -type f \( -name '*.csv' -o -name '*.json' \) -print -quit)"

      - name: JavaScript syntax
        run: node --check docs/assets/app.js
